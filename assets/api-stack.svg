<text x="40" y="245"><tspan fill="#1f2328">  </tspan><tspan fill="#8250df">&quot;architecture&quot;</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#1f2328">[</tspan><tspan fill="#1a7f37">&quot;REST&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Microservices&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;API Gateway&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;BFF&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Event-driven&quot;</tspan><tspan fill="#1f2328">]</tspan><tspan fill="#1f2328">,</tspan></text>
