<text x="40" y="287"><tspan fill="#1f2328">  </tspan><tspan fill="#8250df">&quot;data&quot;</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#1f2328">[</tspan><tspan fill="#1a7f37">&quot;PostgreSQL&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Hibernate&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Flyway&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;MinIO&quot;</tspan><tspan fill="#1f2328">]</tspan><tspan fill="#1f2328">,</tspan></text>
<text x="40" y="308"><tspan fill="#1f2328">  </tspan><tspan fill="#8250df">&quot;security&quot;</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#1f2328">[</tspan><tspan fill="#1a7f37">&quot;JWT&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Role-based access control&quot;</tspan><tspan fill="#1f2328">]</tspan><tspan fill="#1f2328">,</tspan></text>
