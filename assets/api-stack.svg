<text x="40" y="203"><tspan fill="#1f2328">  </tspan><tspan fill="#8250df">&quot;languages&quot;</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#1f2328">[</tspan><tspan fill="#1a7f37">&quot;Java 17+&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;SQL&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;TypeScript&quot;</tspan><tspan fill="#1f2328">]</tspan><tspan fill="#1f2328">,</tspan></text>
