<text x="40" y="350"><tspan fill="#1f2328">  </tspan><tspan fill="#8250df">&quot;infra&quot;</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#1f2328">[</tspan><tspan fill="#1a7f37">&quot;Docker&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Docker Compose&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Kubernetes&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;Linux&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#1a7f37">&quot;CI/CD&quot;</tspan><tspan fill="#1f2328">]</tspan><tspan fill="#1f2328">,</tspan></text>
